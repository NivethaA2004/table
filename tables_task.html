<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskWork</title>
    <style>
        body{
            background-color: rgb(167, 168, 231);
        }
        
        #a{
            text-align:center;
            color: rgb(63, 16, 23);
            /*background-color: rgb(124, 133, 227); */
    
        }
        table{
            width: 100%;
            border: 3px solid black;
            border-radius: 10px;
            border-spacing: 10px;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
            cursor: pointer;

        }
        th,td{
            color: rgb(63, 16, 23);
            border: 3px solid black;
            border-spacing: 10px;
            border-collapse: collapse;
            padding: 10px;
            width:100%;
            text-align: center;
            cursor: pointer;
        }
        th{
            background-color: rgb(220, 152, 106);
        }

        td:hover{
            color: rgb(200, 39, 77);
        }

    </style>
</head>
<body>
    <div id="a">
    <h2> <i>Bank details</i> </h2>
    </div>
    <div id="b">
    <table>
        <tr>
            <th>Username</th>
            <th>Bankname</th>
            <th>Balance</th>
            <th>Withdraw</th>
            <th>DepositedAmount</th>
        </tr>
        <tr>
            <td>Abi</td>
            <td>SBI</td>
            <td>₹10,000</td>
            <td>₹2,000</td>
            <td>₹5,000</td>
            
        </tr>
        <tr>
            <td>Ravi</td>
            <td>HDFC</td>
            <td>₹8,000</td>
            <td>₹1,000</td>
            <td>₹2,000</td>
        </tr>
        </table>
    </div>
        </table>
    </table>
</body>
</html>
